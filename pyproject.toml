[project]
name = "blackboard-mcp"
version = "0.1.0"
description = "Blackboard LMS MCP Server for Claude"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
blackboard-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "server.py",
    "auth.py",
    "blackboard_client.py",
    "tools",
]

[tool.hatch.build.targets.wheel.sources]
"" = ""
